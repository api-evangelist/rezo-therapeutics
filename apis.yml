aid: rezo-therapeutics
name: Rezo Therapeutics
description: >-
  Rezo Therapeutics is a San Francisco (Mission Bay) biopharmaceutical company spun out of
  the Quantitative Biosciences Institute (QBI) at UCSF, co-founded by Nevan Krogan, that is
  building a disease-agnostic network-biology drug discovery platform. Its "sequence to
  systems to drugs" approach integrates proteomics, human genetics, structural biology,
  medicinal chemistry, bioinformatics and machine learning to construct comprehensive maps
  of molecular disease networks and identify novel, druggable targets for precision
  therapeutics, with an initial focus on oncology. The company launched in November 2022
  with a $78M Series A led by SR One, a16z Bio + Health and Norwest Venture Partners, and
  appointed Derek Hicks as chief executive officer in August 2025. Rezo is a therapeutics
  developer rather than a software vendor: its computational platform is internal R&D
  tooling, and the company publishes no public API, SDK, developer portal or machine-readable
  contract of any kind.
